<svg width="860" height="450" viewBox="0 0 860 450" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#0d1117" rx="8"/>
  <text x="430" y="32" fill="#58a6ff" font-size="18" font-weight="bold" text-anchor="middle">Empirical Comparison: Suffix Trie vs. Aho-Corasick Automaton</text>
  <text x="430" y="52" fill="#8b949e" font-size="12" text-anchor="middle">Resident Memory Footprint (MB) &amp; Rule Compilation Latency (ms) Across 1k to 100k Rules</text>
  <!-- Memory Chart Left -->
  <g transform="translate(60, 80)">
    <text x="160" y="15" fill="#c9d1d9" font-size="14" font-weight="600" text-anchor="middle">Resident Memory Footprint (MB)</text>
    <line x1="40" y1="30" x2="40" y2="250" stroke="#30363d" stroke-width="1"/>
    <line x1="40" y1="250" x2="330" y2="250" stroke="#30363d" stroke-width="1"/>
    <text x="35" y="40" fill="#8b949e" font-size="10" text-anchor="end">180 MB</text>
    <text x="35" y="145" fill="#8b949e" font-size="10" text-anchor="end">90 MB</text>
    <text x="35" y="250" fill="#8b949e" font-size="10" text-anchor="end">0 MB</text>
    <line x1="40" y1="145" x2="330" y2="145" stroke="#21262d" stroke-dasharray="4"/>
    <line x1="40" y1="40" x2="330" y2="40" stroke="#21262d" stroke-dasharray="4"/>
    <rect x="55" y="247" width="24" height="3" fill="#3fb950" rx="3"/>
    <rect x="83" y="247" width="24" height="3" fill="#f85149" rx="3"/>
    <text x="79" y="268" fill="#8b949e" font-size="11" text-anchor="middle">1k</text>
    <rect x="123" y="247" width="24" height="3" fill="#3fb950" rx="3"/>
    <rect x="151" y="232" width="24" height="18" fill="#f85149" rx="3"/>
    <text x="147" y="268" fill="#8b949e" font-size="11" text-anchor="middle">10k</text>
    <text x="163" y="228" fill="#f85149" font-size="9" font-weight="bold" text-anchor="middle">16.2M</text>
    <rect x="191" y="246" width="24" height="4" fill="#3fb950" rx="3"/>
    <rect x="219" y="140" width="24" height="110" fill="#f85149" rx="3"/>
    <text x="215" y="268" fill="#8b949e" font-size="11" text-anchor="middle">50k</text>
    <text x="231" y="136" fill="#f85149" font-size="9" font-weight="bold" text-anchor="middle">94.3M</text>
    <text x="203" y="242" fill="#3fb950" font-size="9" font-weight="bold" text-anchor="middle">3.7M</text>
    <rect x="259" y="245" width="24" height="5" fill="#3fb950" rx="3"/>
    <rect x="287" y="60" width="24" height="190" fill="#f85149" rx="3"/>
    <text x="283" y="268" fill="#8b949e" font-size="11" text-anchor="middle">100k</text>
    <text x="299" y="56" fill="#f85149" font-size="9" font-weight="bold" text-anchor="middle">163.0M</text>
    <text x="271" y="241" fill="#3fb950" font-size="9" font-weight="bold" text-anchor="middle">4.6M</text>
    <text x="270" y="45" fill="#e3b341" font-size="10" font-weight="bold" text-anchor="middle">35.5x Lower Memory</text>
  </g>
  <!-- Build Time Chart Right -->
  <g transform="translate(470, 80)">
    <text x="160" y="15" fill="#c9d1d9" font-size="14" font-weight="600" text-anchor="middle">Rule Rebuild / Swap Latency (ms)</text>
    <line x1="40" y1="30" x2="40" y2="250" stroke="#30363d" stroke-width="1"/>
    <line x1="40" y1="250" x2="330" y2="250" stroke="#30363d" stroke-width="1"/>
    <text x="35" y="40" fill="#8b949e" font-size="10" text-anchor="end">140 ms</text>
    <text x="35" y="145" fill="#8b949e" font-size="10" text-anchor="end">70 ms</text>
    <text x="35" y="250" fill="#8b949e" font-size="10" text-anchor="end">0 ms</text>
    <line x1="40" y1="145" x2="330" y2="145" stroke="#21262d" stroke-dasharray="4"/>
    <line x1="40" y1="40" x2="330" y2="40" stroke="#21262d" stroke-dasharray="4"/>
    <rect x="55" y="247" width="24" height="3" fill="#3fb950" rx="3"/>
    <rect x="83" y="247" width="24" height="3" fill="#f85149" rx="3"/>
    <text x="79" y="268" fill="#8b949e" font-size="11" text-anchor="middle">1k</text>
    <rect x="123" y="247" width="24" height="3" fill="#3fb950" rx="3"/>
    <rect x="151" y="241" width="24" height="9" fill="#f85149" rx="3"/>
    <text x="147" y="268" fill="#8b949e" font-size="11" text-anchor="middle">10k</text>
    <rect x="191" y="233" width="24" height="17" fill="#3fb950" rx="3"/>
    <rect x="219" y="152" width="24" height="98" fill="#f85149" rx="3"/>
    <text x="215" y="268" fill="#8b949e" font-size="11" text-anchor="middle">50k</text>
    <text x="231" y="148" fill="#f85149" font-size="9" font-weight="bold" text-anchor="middle">66ms</text>
    <text x="203" y="229" fill="#3fb950" font-size="9" font-weight="bold" text-anchor="middle">11ms</text>
    <rect x="259" y="215" width="24" height="35" fill="#3fb950" rx="3"/>
    <rect x="287" y="54" width="24" height="196" fill="#f85149" rx="3"/>
    <text x="283" y="268" fill="#8b949e" font-size="11" text-anchor="middle">100k</text>
    <text x="299" y="50" fill="#f85149" font-size="9" font-weight="bold" text-anchor="middle">131ms</text>
    <text x="271" y="211" fill="#3fb950" font-size="9" font-weight="bold" text-anchor="middle">24ms</text>
    <text x="270" y="45" fill="#e3b341" font-size="10" font-weight="bold" text-anchor="middle">5.0x Faster Compilation</text>
  </g>
  <!-- Legend -->
  <g transform="translate(140, 375)">
    <rect x="0" y="0" width="14" height="14" fill="#3fb950" rx="3"/>
    <text x="22" y="12" fill="#c9d1d9" font-size="12">Reverse-Label Suffix Trie (ARM64 Optimized — 0 False Positives, O(L) Lookup)</text>
    <rect x="0" y="24" width="14" height="14" fill="#f85149" rx="3"/>
    <text x="22" y="36" fill="#c9d1d9" font-size="12">Aho-Corasick Automaton (High State Overhead — 3 Boundary False Positives)</text>
  </g>
</svg>