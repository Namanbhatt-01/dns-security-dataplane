<svg width="800" height="420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="400" y="32" fill="#58a6ff" font-size="18" font-weight="bold" text-anchor="middle">Empirical Comparison: Suffix Trie vs Aho-Corasick Automaton</text>
  <text x="400" y="52" fill="#8b949e" font-size="12" text-anchor="middle">Memory Footprint (MB) &amp; Rebuild Latency (ms) Across Rule Scales (1k - 100k)</text>
  <!-- Memory Chart Left -->
  <g transform="translate(60, 80)">
    <text x="140" y="15" fill="#c9d1d9" font-size="14" font-weight="600" text-anchor="middle">Resident Memory Footprint (MB)</text>
    <line x1="40" y1="30" x2="40" y2="250" stroke="#30363d" stroke-width="1"/>
    <line x1="40" y1="250" x2="310" y2="250" stroke="#30363d" stroke-width="1"/>
    <text x="35" y="40" fill="#8b949e" font-size="10" text-anchor="end">180MB</text>
    <text x="35" y="145" fill="#8b949e" font-size="10" text-anchor="end">90MB</text>
    <text x="35" y="250" fill="#8b949e" font-size="10" text-anchor="end">0MB</text>
    <line x1="40" y1="145" x2="310" y2="145" stroke="#21262d" stroke-dasharray="4"/>
    <line x1="40" y1="40" x2="310" y2="40" stroke="#21262d" stroke-dasharray="4"/>
    <rect x="55" y="248" width="22" height="2" fill="#3fb950" rx="3"/>
    <rect x="81" y="248" width="22" height="2" fill="#f85149" rx="3"/>
    <text x="77" y="268" fill="#8b949e" font-size="11" text-anchor="middle">1k</text>
    <rect x="120" y="248" width="22" height="2" fill="#3fb950" rx="3"/>
    <rect x="146" y="232" width="22" height="18" fill="#f85149" rx="3"/>
    <text x="142" y="268" fill="#8b949e" font-size="11" text-anchor="middle">10k</text>
    <rect x="185" y="246" width="22" height="4" fill="#3fb950" rx="3"/>
    <rect x="211" y="140" width="22" height="110" fill="#f85149" rx="3"/>
    <text x="207" y="268" fill="#8b949e" font-size="11" text-anchor="middle">50k</text>
    <text x="222" y="136" fill="#f85149" font-size="9" text-anchor="middle">94.3M</text>
    <rect x="250" y="245" width="22" height="5" fill="#3fb950" rx="3"/>
    <rect x="276" y="60" width="22" height="190" fill="#f85149" rx="3"/>
    <text x="272" y="268" fill="#8b949e" font-size="11" text-anchor="middle">100k</text>
    <text x="287" y="56" fill="#f85149" font-size="9" text-anchor="middle">163.0M</text>
  </g>
  <!-- Build Time Chart Right -->
  <g transform="translate(420, 80)">
    <text x="160" y="15" fill="#c9d1d9" font-size="14" font-weight="600" text-anchor="middle">Rule Rebuild / Swap Latency (ms)</text>
    <line x1="40" y1="30" x2="40" y2="250" stroke="#30363d" stroke-width="1"/>
    <line x1="40" y1="250" x2="330" y2="250" stroke="#30363d" stroke-width="1"/>
    <text x="35" y="40" fill="#8b949e" font-size="10" text-anchor="end">140ms</text>
    <text x="35" y="145" fill="#8b949e" font-size="10" text-anchor="end">70ms</text>
    <text x="35" y="250" fill="#8b949e" font-size="10" text-anchor="end">0ms</text>
    <line x1="40" y1="145" x2="330" y2="145" stroke="#21262d" stroke-dasharray="4"/>
    <line x1="40" y1="40" x2="330" y2="40" stroke="#21262d" stroke-dasharray="4"/>
    <rect x="55" y="248" width="22" height="2" fill="#3fb950" rx="3"/>
    <rect x="81" y="248" width="22" height="2" fill="#f85149" rx="3"/>
    <text x="77" y="268" fill="#8b949e" font-size="11" text-anchor="middle">1k</text>
    <rect x="125" y="247" width="22" height="3" fill="#3fb950" rx="3"/>
    <rect x="151" y="241" width="22" height="9" fill="#f85149" rx="3"/>
    <text x="147" y="268" fill="#8b949e" font-size="11" text-anchor="middle">10k</text>
    <rect x="195" y="233" width="22" height="17" fill="#3fb950" rx="3"/>
    <rect x="221" y="152" width="22" height="98" fill="#f85149" rx="3"/>
    <text x="217" y="268" fill="#8b949e" font-size="11" text-anchor="middle">50k</text>
    <text x="232" y="148" fill="#f85149" font-size="9" text-anchor="middle">66ms</text>
    <text x="206" y="229" fill="#3fb950" font-size="9" text-anchor="middle">11ms</text>
    <rect x="265" y="215" width="22" height="35" fill="#3fb950" rx="3"/>
    <rect x="291" y="54" width="22" height="196" fill="#f85149" rx="3"/>
    <text x="287" y="268" fill="#8b949e" font-size="11" text-anchor="middle">100k</text>
    <text x="302" y="50" fill="#f85149" font-size="9" text-anchor="middle">131ms</text>
    <text x="276" y="211" fill="#3fb950" font-size="9" text-anchor="middle">24ms</text>
  </g>
  <!-- Legend -->
  <g transform="translate(250, 380)">
    <rect x="0" y="0" width="16" height="16" fill="#3fb950" rx="3"/>
    <text x="24" y="13" fill="#c9d1d9" font-size="12">Reverse-Label Suffix Trie (ARM64 Optimized - 0 False Positives)</text>
    <rect x="360" y="0" width="16" height="16" fill="#f85149" rx="3"/>
    <text x="384" y="13" fill="#c9d1d9" font-size="12">Aho-Corasick Automaton (Graph Overhead - Boundary FPs)</text>
  </g>
</svg>